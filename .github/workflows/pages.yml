name: Deploy site to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build static site
        env:
          SCRIPTLESS_WORKER_URL: ${{ vars.SCRIPTLESS_WORKER_URL }}
        run: |
          if [ -z "$SCRIPTLESS_WORKER_URL" ]; then
            echo "::error::Set the repository variable SCRIPTLESS_WORKER_URL (Settings > Secrets and variables > Actions > Variables) to your Worker address."
            exit 1
          fi
          node scripts/build-site.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
