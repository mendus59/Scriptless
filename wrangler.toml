name = "scriptless"
main = "src/worker.js"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]

# Privacy: no Workers Logs, no observability sampling, no tail consumers.
[observability]
enabled = false

[[rules]]
type = "Text"
globs = ["**/*.css"]
fallthrough = true

# Lets Cloudflare Workers Builds create preview deployments for pull requests
# (`wrangler preview`). Empty on purpose: previews inherit the settings above.
[previews]
